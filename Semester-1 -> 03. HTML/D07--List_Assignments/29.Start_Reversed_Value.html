<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start + Reversed + Value</title>
</head>
<body>
    <ol start="5" reversed>

    <li>Task One</li>

    <li>Task Two</li>

    <li value="10">Task Three</li>

    <li>Task Four</li>

    <li>Task Five</li>

    </ol>
</body>
</html>
