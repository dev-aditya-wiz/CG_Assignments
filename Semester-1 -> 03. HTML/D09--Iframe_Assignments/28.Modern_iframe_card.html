<!DOCTYPE html>
<html>
<head>
    <title>Iframe Card</title>

    <style>
        .card {
            width: 90%;
            max-width: 800px;
            height: 400px;
            margin: auto;
            padding: 10px;
            box-shadow: 0 4px 15px gray;
            border-radius: 15px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <iframe
        src="https://example.com"
        allow="gyroscope"
        title="Gyroscope Interactive Card">
    </iframe>

</div>

</body>
</html>
