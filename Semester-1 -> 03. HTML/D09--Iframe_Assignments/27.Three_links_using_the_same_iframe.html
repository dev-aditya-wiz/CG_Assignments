<!DOCTYPE html>
<html>
<head>
    <title>Iframe Navigation</title>
</head>
<body>

<ul>
    <li>
        <a href="https://www.example.com" target="myFrame">
            Example
        </a>
    </li>

    <li>
        <a href="https://www.wikipedia.org" target="myFrame">
            Wikipedia
        </a>
    </li>

    <li>
        <a href="https://www.w3schools.com" target="myFrame">
            W3Schools
        </a>
    </li>
</ul>

<iframe
    name="myFrame"
    width="100%"
    height="400"
    allow="fullscreen"
    title="Fullscreen Website Frame"
    style="border: none;">
</iframe>

</body>
</html>
