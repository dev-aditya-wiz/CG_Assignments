<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Rowspan</title>
</head>
<body>
    <table border="1">

    <tr>
        <td rowspan="2">Programming Track</td>
        <td>Semester 1</td>
    </tr>

    <tr>
        <td>Semester 2</td>
    </tr>

    </table>
</body>
</html>
