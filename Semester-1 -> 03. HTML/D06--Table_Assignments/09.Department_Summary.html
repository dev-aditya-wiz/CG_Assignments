<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Summary</title>
</head>
<body>
    <table border="1">

    <caption>Department Summary</caption>

    <thead>
        <tr>
            <th scope="col">Department</th>
            <th scope="col">Students</th>
            <th scope="col">Faculty</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Computer Science</td>
            <td>120</td>
            <td>10</td>
        </tr>

        <tr>
            <td>Data Science</td>
            <td>80</td>
            <td>8</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">Overall Total</td>
        </tr>
    </tfoot>

    </table>
</body>
</html>
