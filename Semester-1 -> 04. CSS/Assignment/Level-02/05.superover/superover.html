<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over Scoreboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #07101e 0%, #0d1b2a 45%, #102616 45%, #051007 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
        }

        .container {
            width: 820px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 35px;
        }

        .logo-text {
            color: white;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 3px;
            line-height: 1.05;
            text-align: left;
            text-transform: uppercase;
        }

        .logo-text span {
            font-size: 13px;
            letter-spacing: 5px;
            display: block;
        }

        .cards-wrapper {
            display: flex;
            gap: 35px;
            margin-bottom: 40px;
            width: 100%;
            justify-content: center;
        }

        .card {
            width: 350px;
            height: 310px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 35px 20px 30px 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .card-ind {
            background-color: #1652a1;
        }

        .card-pak {
            background-color: #318a38;
        }

        .team-title {
            color: #ffffff;
            font-size: 46px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .balls-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .ball {
            width: 36px;
            height: 36px;
            background-color: #ffffff;
            color: #111;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .total-score {
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .actions-wrapper {
            display: flex;
            gap: 25px;
        }

        .btn {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-bat {
            background-color: #ffbc38;
        }

        .btn-reset {
            background-color: #e53935;
        }

        .icon-bat {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            transform: rotate(-45deg);
        }

        .icon-reset {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-header">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="#fff">
                <path d="M18.5 2h-3C14.67 2 14 2.67 14 3.5v17c0 .83.67 1.5 1.5 1.5h3c.83 0 1.5-.67 1.5-1.5v-17c0-.83-.67-1.5-1.5-1.5zM11 5H8C6.34 5 5 6.34 5 8v8c0 1.66 1.34 3 3 3h3v-2H8c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h3V5zm-4.5 9.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                <circle cx="9.5" cy="18.5" r="1.5"/>
            </svg>
            <div class="logo-text">
                SUPER
                <span>OVER</span>
            </div>
        </div>

        <div class="cards-wrapper">
            <div class="card card-ind">
                <div class="team-title">IND</div>
                <div class="balls-container">
                    <div class="ball">4</div>
                    <div class="ball">3</div>
                    <div class="ball">2</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                    <div class="ball">6</div>
                </div>
                <div class="total-score">27 / 0</div>
            </div>

            <div class="card card-pak">
                <div class="team-title">PAK</div>
                <div class="balls-container">
                    <div class="ball">2</div>
                    <div class="ball">4</div>
                    <div class="ball">0</div>
                    <div class="ball">3</div>
                    <div class="ball">1</div>
                    <div class="ball">4</div>
                </div>
                <div class="total-score">14 / 0</div>
            </div>
        </div>

        <div class="actions-wrapper">
            <button class="btn btn-bat" title="Hit">
                <svg class="icon-bat" viewBox="0 0 24 24">
                    <path d="M19.07 4.93l-1.41-1.41L12 9.17 6.34 3.51 4.93 4.93 10.59 10.6 3 18.19V21h2.81l7.59-7.59 5.66 5.66 1.41-1.41-5.66-5.66 5.67-5.67z"/>
                </svg>
            </button>
            <button class="btn btn-reset" title="Reset">
                <svg class="icon-reset" viewBox="0 0 24 24">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
        </div>
    </div>

</body>
</html>
