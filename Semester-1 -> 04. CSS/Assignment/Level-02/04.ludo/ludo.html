<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
            margin: 0;
        }

        .ludo-board {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 2px solid black;
            background-color: black;
            gap: 1px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .yard-red {
            grid-column: 1 / 7;
            grid-row: 1 / 7;
            background-color: red;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .yard-green {
            grid-column: 10 / 16;
            grid-row: 1 / 7;
            background-color: green;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .yard-blue {
            grid-column: 1 / 7;
            grid-row: 10 / 16;
            background-color: blue;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .yard-yellow {
            grid-column: 10 / 16;
            grid-row: 10 / 16;
            background-color: yellow;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .inner-yard {
            width: 100%;
            height: 100%;
            background-color: white;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 16px;
            box-sizing: border-box;
            gap: 16px;
        }

        .token-slot {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .token-circle {
            border-radius: 50%;
            border: 5px solid;
            width: 70%;
            height: 70%;
            box-sizing: border-box;
        }

        .tc-red { border-color: red; }
        .tc-green { border-color: green; }
        .tc-blue { border-color: blue; }
        .tc-yellow { border-color: yellow; }

        .cell {
            background-color: white;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .bg-red { background-color: red; }
        .bg-green { background-color: green; }
        .bg-blue { background-color: blue; }
        .bg-yellow { background-color: yellow; }

        .home-center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            position: relative;
            background-color: white;
            overflow: hidden;
        }

        .triangle {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tri-green {
            background-color: green;
            clip-path: polygon(0 0, 50% 50%, 100% 0);
        }

        .tri-yellow {
            background-color: yellow;
            clip-path: polygon(100% 0, 50% 50%, 100% 100%);
        }

        .tri-blue {
            background-color: blue;
            clip-path: polygon(0 100%, 50% 50%, 100% 100%);
        }

        .tri-red {
            background-color: red;
            clip-path: polygon(0 0, 50% 50%, 0 100%);
        }

        .star::after {
            content: "★";
            font-size: 20px;
            color: black;
        }
    </style>
</head>
<body>

    <div class="ludo-board">
        <div class="yard-red">
            <div class="inner-yard">
                <div class="token-slot"><div class="token-circle tc-red"></div></div>
                <div class="token-slot"><div class="token-circle tc-red"></div></div>
                <div class="token-slot"><div class="token-circle tc-red"></div></div>
                <div class="token-slot"><div class="token-circle tc-red"></div></div>
            </div>
        </div>

        <div class="yard-green">
            <div class="inner-yard">
                <div class="token-slot"><div class="token-circle tc-green"></div></div>
                <div class="token-slot"><div class="token-circle tc-green"></div></div>
                <div class="token-slot"><div class="token-circle tc-green"></div></div>
                <div class="token-slot"><div class="token-circle tc-green"></div></div>
            </div>
        </div>

        <div class="yard-blue">
            <div class="inner-yard">
                <div class="token-slot"><div class="token-circle tc-blue"></div></div>
                <div class="token-slot"><div class="token-circle tc-blue"></div></div>
                <div class="token-slot"><div class="token-circle tc-blue"></div></div>
                <div class="token-slot"><div class="token-circle tc-blue"></div></div>
            </div>
        </div>

        <div class="yard-yellow">
            <div class="inner-yard">
                <div class="token-slot"><div class="token-circle tc-yellow"></div></div>
                <div class="token-slot"><div class="token-circle tc-yellow"></div></div>
                <div class="token-slot"><div class="token-circle tc-yellow"></div></div>
                <div class="token-slot"><div class="token-circle tc-yellow"></div></div>
            </div>
        </div>

        <div class="home-center">
            <div class="triangle tri-green"></div>
            <div class="triangle tri-yellow"></div>
            <div class="triangle tri-blue"></div>
            <div class="triangle tri-red"></div>
        </div>

        <div class="cell" style="grid-column: 7; grid-row: 1;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 1;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 1;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 2;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 2;"></div>
        <div class="cell bg-green star" style="grid-column: 9; grid-row: 2;"></div>

        <div class="cell bg-green star" style="grid-column: 7; grid-row: 3;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 3;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 3;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 4;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 4;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 4;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 5;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 5;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 5;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 6;"></div>
        <div class="cell bg-green" style="grid-column: 8; grid-row: 6;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 6;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 10;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 10;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 10;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 11;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 11;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 11;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 12;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 12;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 12;"></div>

        <div class="cell bg-blue star" style="grid-column: 7; grid-row: 13;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 13;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 13;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 14;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 14;"></div>
        <div class="cell bg-blue star" style="grid-column: 9; grid-row: 14;"></div>

        <div class="cell" style="grid-column: 7; grid-row: 15;"></div>
        <div class="cell bg-blue" style="grid-column: 8; grid-row: 15;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 15;"></div>

        <div class="cell" style="grid-column: 1; grid-row: 7;"></div>
        <div class="cell bg-red star" style="grid-column: 2; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 3; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 4; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 5; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 6; grid-row: 7;"></div>

        <div class="cell bg-red" style="grid-column: 1; grid-row: 8;"></div>
        <div class="cell bg-red" style="grid-column: 2; grid-row: 8;"></div>
        <div class="cell bg-red" style="grid-column: 3; grid-row: 8;"></div>
        <div class="cell bg-red" style="grid-column: 4; grid-row: 8;"></div>
        <div class="cell bg-red" style="grid-column: 5; grid-row: 8;"></div>
        <div class="cell bg-red" style="grid-column: 6; grid-row: 8;"></div>

        <div class="cell" style="grid-column: 1; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 2; grid-row: 9;"></div>
        <div class="cell bg-red star" style="grid-column: 3; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 4; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 5; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 6; grid-row: 9;"></div>

        <div class="cell" style="grid-column: 10; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 11; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 12; grid-row: 7;"></div>
        <div class="cell bg-yellow star" style="grid-column: 13; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 14; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 15; grid-row: 7;"></div>

        <div class="cell bg-yellow" style="grid-column: 10; grid-row: 8;"></div>
        <div class="cell bg-yellow" style="grid-column: 11; grid-row: 8;"></div>
        <div class="cell bg-yellow" style="grid-column: 12; grid-row: 8;"></div>
        <div class="cell bg-yellow" style="grid-column: 13; grid-row: 8;"></div>
        <div class="cell bg-yellow" style="grid-column: 14; grid-row: 8;"></div>
        <div class="cell bg-yellow" style="grid-column: 15; grid-row: 8;"></div>

        <div class="cell" style="grid-column: 10; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 11; grid-row: 9;"></div>
        <div class="cell bg-yellow star" style="grid-column: 12; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 13; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 14; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 15; grid-row: 9;"></div>

        <div class="cell bg-green" style="grid-column: 7; grid-row: 7;"></div>
        <div class="cell bg-red" style="grid-column: 7; grid-row: 9;"></div>
        <div class="cell bg-yellow" style="grid-column: 9; grid-row: 7;"></div>
        <div class="cell bg-blue" style="grid-column: 9; grid-row: 9;"></div>

        <div class="cell" style="grid-column: 8; grid-row: 7;"></div>
        <div class="cell" style="grid-column: 8; grid-row: 9;"></div>
        <div class="cell" style="grid-column: 7; grid-row: 8;"></div>
        <div class="cell" style="grid-column: 9; grid-row: 8;"></div>
    </div>

</body>
</html>
