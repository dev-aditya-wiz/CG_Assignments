<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Puzzle & Answer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #ffffff;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sudoku-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 20px;
            letter-spacing: 2px;
            color: #222;
            margin-bottom: 12px;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            border: 3px solid #000;
            background-color: #000;
            gap: 1px;
        }

        .cell {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #111;
            user-select: none;
        }

        .cell.g-tm { background-color: #c2e0cd; }
        .cell.g-c  { background-color: #ffffff; }
        .cell.g-bm { background-color: #c2e0cd; }
        .cell.g-lm { background-color: #c2e0cd; }
        .cell.g-rm { background-color: #c2e0cd; }
        .cell.g-tl { background-color: #ffffff; }
        .cell.g-br { background-color: #ffffff; }

        .cell:nth-child(9n+3),
        .cell:nth-child(9n+6) {
            border-right: 2px solid #000;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #000;
        }

        @media (max-width: 600px) {
            .sudoku-grid {
                grid-template-columns: repeat(9, 32px);
                grid-template-rows: repeat(9, 32px);
            }
            .cell {
                font-size: 14px;
            }
            .container {
                gap: 20px;
            }
        }
    </style>
</head>
