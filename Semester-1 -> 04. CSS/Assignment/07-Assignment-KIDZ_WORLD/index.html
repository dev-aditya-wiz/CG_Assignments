<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDZ WORLD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #ffffff;
        }
        .logo img {
            height: 28px;
            display: block;
        }
        .cart {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .banner {
            width: 100%;
            height: 350px;
            background-image: url(./assets/web_banner.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            padding: 3%;
        }
        .text {
            font-size: 26px;

            color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="./assets/web_logo.png" alt="">
        </div>
        <div class="cart">
            <img src="./assets/cart.png" alt="Cart" width="28px" height="28px">
            <span>Cart items (0)</span>
        </div>
    </nav>

    <header class="banner">
        <div class="text">
            <h1>Shop.</h1>
            <h1>Have Fun.</h1>
            <h1>Repeat.</h1>
            <br>
            <p>#NewAndNow</p>
        </div>
    </header>

    <div class="container">
        <div class="section">
            <h2 class="section-title">Discover New Books</h2>
            <div class="grid-books">
                <div class="card">
                    <img src="" class="">
                    <h3 class="card-title">This was our pact</h3>
                    <p class="card-subtitle">Ryan Andrews</p>
                    <div class="card-footer">
                        <span class="price">$7.49</span>
                        <button class="btn-add"></button>
                    </div>
            </div>
        </div>
    </div>
</body>
</html>
