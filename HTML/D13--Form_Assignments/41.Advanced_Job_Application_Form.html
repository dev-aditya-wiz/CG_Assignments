<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="/apply.php"
      method="post"
      enctype="multipart/form-data">

    <h2>Job Application</h2>

    <fieldset>
        <legend>Personal Details</legend>

        <label for="fullName">Full Name:</label>
        <input
            type="text"
            id="fullName"
            name="fullName"
            required
        >

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="phone">Phone:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            required
        >
    </fieldset>

    <fieldset>
        <legend>Experience</legend>

        <label for="experience">
            Describe your experience:
        </label>

        <textarea
            id="experience"
            name="experience"
            rows="6"
            cols="50"
            required
        ></textarea>
    </fieldset>

    <fieldset>
        <legend>Resume</legend>

        <label for="resume">Upload Resume:</label>

        <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf"
            required
        >
    </fieldset>

    <fieldset>
        <legend>Employment Type</legend>

        <input
            type="radio"
            id="fullTime"
            name="employmentType"
            value="full-time"
        >
        <label for="fullTime">Full-Time</label>

        <input
            type="radio"
            id="partTime"
            name="employmentType"
            value="part-time"
        >
        <label for="partTime">Part-Time</label>

        <input
            type="radio"
            id="contract"
            name="employmentType"
            value="contract"
        >
        <label for="contract">Contract</label>
    </fieldset>

    <input
        type="checkbox"
        id="terms"
        name="terms"
        value="accepted"
        required
    >
    <label for="terms">
        I agree to the terms and conditions.
    </label>

    <br><br>

    <button type="submit">Submit Application</button>

    <button type="submit" formnovalidate>
        Save Draft
    </button>
</form>
</body>
</html>
