<!DOCTYPE html>
<html>
<head>
    <title>Semantic Code Elements</title>

    <style>
        pre {
            background-color: #1e1e1e;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            overflow-x: auto;
        }

        kbd {
            background-color: #f2f2f2;
            border: 1px solid #999;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>

<body>

<h1>Programming Examples</h1>

<p>
    Use the CSS property <code>color: blue;</code> to change the text color.
</p>

<p>
    Press <kbd>Ctrl + S</kbd> to save your file.
</p>

<p>
    The program displays <samp>Error: File not found</samp>.
</p>

<p>
    In the formula, <var>x</var> represents the value of the variable.
</p>

<pre>
def greet(name):
    print("Hello, " + name)

greet("John")
</pre>

</body>
</html>
