<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete image tag</title>
</head>
<body>
    <img
    src="images/nature.jpg"
    alt="Beautiful photo"
    width="300"
    height="200"
    loading="lazy"
    title="View beautiful photo"
    srcset="
        images/nature-small.jpg 400w,
        images/nature-large.jpg 800w
    "
    > 
</body>
</html>
