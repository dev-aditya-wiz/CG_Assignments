<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images: Eager vs Lazy Loading</title>
</head>
<body>
    
    <img
    src="assets/logo.png"
    alt="Website logo"
    width="250"
    loading="eager">

    <img
    src="images/products/shoe.jpg"
    alt="Product shoe"
    width="250"
    loading="lazy">

</body>
</html>
