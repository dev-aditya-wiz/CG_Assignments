<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive image using srcset</title>
</head>
<body>
    <img
    src="medium.jpg"
    alt="Responsive image"
    srcset="
        small.jpg 400w,
        medium.jpg 800w,
        large.jpg 1200w">
</body>
</html>
