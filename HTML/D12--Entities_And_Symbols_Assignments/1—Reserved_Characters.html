<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>The less-than symbol is written as &lt; in HTML.</p>
    <p>The greater-than symbol is written as &gt; in HTML.</p>
    <p>The ampersand symbol is written as &amp; in HTML.</p>

    <p>The less-than symbol is written as &#x3C; in HTML.</p>
    <p>The greater-than symbol is written as &#x3E; in HTML.</p>
    <p>The ampersand symbol is written as &#x26; in HTML.</p>
</body>
</html>
