<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbreviation + Blockquote + Citation</title>
</head>
<body>
    <p>
    <abbr title="Horizon University Institute">HUI</abbr>
    focuses on practical education.
    </p>

    <blockquote>
    Industry-oriented training helps students develop practical skills
    required in real-world careers.

    <cite>Academic Brochure 2026</cite>
    </blockquote>
</body>
</html>
