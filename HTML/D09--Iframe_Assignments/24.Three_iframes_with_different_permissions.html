<!DOCTYPE html>
<html>
<head>
    <title>Three Iframes</title>
</head>
<body>

<h2>Fullscreen</h2>

<iframe
    src="https://example.com"
    width="500"
    height="300"
    allow="fullscreen"
    title="Fullscreen Frame"
    style="border: none;">
</iframe>

<h2>Gyroscope</h2>

<iframe
    src="https://example.com"
    width="600"
    height="350"
    allow="gyroscope"
    title="Gyroscope Frame"
    style="border: none;">
</iframe>

<h2>USB</h2>

<iframe
    src="https://device.example.com"
    width="700"
    height="400"
    allow="usb"
    title="USB Device Frame"
    style="border: none;">
</iframe>

</body>
</html>
