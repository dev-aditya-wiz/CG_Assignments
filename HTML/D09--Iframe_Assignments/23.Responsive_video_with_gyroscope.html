<!DOCTYPE html>
<html>
<head>
    <title>Responsive Video</title>

    <style>
        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        @media (max-width: 600px) {
            iframe {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<iframe
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    allow="fullscreen; gyroscope"
    allowfullscreen
    title="Responsive Video with Gyroscope">
</iframe>

</body>
</html>
