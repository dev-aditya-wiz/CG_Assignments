<!DOCTYPE html>
<html>
<head>
    <title>Device Control</title>

    <style>
        iframe {
            width: 45%;
            height: 350px;
            border: none;
            margin: 10px;
        }
    </style>
</head>

<body>

<iframe
    src="https://device.example.com"
    allow="usb"
    title="USB Device Control">
</iframe>

<iframe
    src="https://example.com"
    allow="gyroscope"
    title="Gyroscope Control">
</iframe>

</body>
</html>
