<!DOCTYPE html>
<html>
<head>
    <title>Permission Example</title>
</head>
<body>

<h1>Device Permissions</h1>

<p>
    The following iframes demonstrate different permissions.
</p>

<iframe
    src="https://device.example.com"
    width="600"
    height="300"
    allow="usb"
    title="USB Device Frame"
    style="border: none;">
</iframe>

<br><br>

<iframe
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    width="560"
    height="315"
    allow="fullscreen"
    allowfullscreen
    title="Fullscreen Video Frame"
    style="border: none;">
</iframe>

</body>
</html>
