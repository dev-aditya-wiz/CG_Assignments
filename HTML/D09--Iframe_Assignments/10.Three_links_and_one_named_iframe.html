<!DOCTYPE html>
<html>
<head>
    <title>Navigation Iframe</title>
</head>
<body>

<a href="https://www.example.com" target="myFrame">Example</a>
<br>
<a href="https://www.wikipedia.org" target="myFrame">Wikipedia</a>
<br>

<iframe
    name="myFrame"
    width="100%"
    height="400"
    title="Website Display"
    style="border: none;">
</iframe>

</body>
</html>
