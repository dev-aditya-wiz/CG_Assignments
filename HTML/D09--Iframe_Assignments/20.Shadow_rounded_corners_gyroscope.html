<!DOCTYPE html>
<html>
<head>
    <title>Styled Iframe</title>

    <style>
        iframe {
            width: 100%;
            height: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px gray;
        }
    </style>
</head>

<body>

<iframe
    src="https://example.com"
    allow="gyroscope"
    title="Gyroscope Interactive Content">
</iframe>

</body>
</html>
