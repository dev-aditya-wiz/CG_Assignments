<!DOCTYPE html>
<html>

    <title>Link and Iframe</title>
</head>
<body>

<a href="https://www.example.com" target="exampleFrame">
    Open Example Site
</a>

<iframe
    name="exampleFrame"
    width="100%"
    height="300"
    title="Example Website"
    style="border: none;">
</iframe>

</body>
</html>
