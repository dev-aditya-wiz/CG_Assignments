<!DOCTYPE html>
<html>
<head>
    <title>Best Practice Iframes</title>

    <style>
        iframe {
            border: none;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h1>Iframe Examples</h1>

<iframe
    src="https://www.example.com"
    width="100%"
    height="300"
    title="Normal Example Website">
</iframe>

<br>

<iframe
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    width="560"
    height="315"
    allow="fullscreen; gyroscope"
    allowfullscreen
    title="Video with Fullscreen and Gyroscope">
</iframe>

<br>

<iframe
    src="https://device.example.com"
    width="600"
    height="400"
    allow="usb"
    title="USB Device Control">
</iframe>

</body>
</html>
