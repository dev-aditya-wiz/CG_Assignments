<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Caption</title>
</head>
<body>
    <table border="1">

    <caption>Monthly Workshop Schedule</caption>

    <tr>
        <th>Workshop</th>
        <th>Month</th>
    </tr>

    <tr>
        <td>Web Design</td>
        <td>January</td>
    </tr>

    <tr>
        <td>Python Basics</td>
        <td>February</td>
    </tr>

    </table>
</body>
</html>
