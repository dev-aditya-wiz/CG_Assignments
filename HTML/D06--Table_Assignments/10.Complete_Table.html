<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Table</title>
</head>
<body>
    <table border="1">

    <caption>Course Performance Report</caption>

    <thead>
        <tr>
            <th scope="col">Course</th>
            <th scope="col">Students</th>
            <th scope="col">Status</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <th scope="row">Web Development</th>
            <td>50</td>
            <td>Active</td>
        </tr>

        <tr>
            <th scope="row">Data Analytics</th>
            <td>40</td>
            <td>Active</td>
        </tr>

        <tr>
            <td colspan="2">Total Courses</td>
            <td>2</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">End of Report</td>
        </tr>
    </tfoot>

    </table>
</body>
</html>
