<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan + rowspan</title>
</head>
<body>
    <table border="1">

    <tr>
        <th colspan="3">Course Comparison</th>
    </tr>

    <tr>
        <th>Category</th>
        <th>Web Development</th>
        <th>Data Analytics</th>
    </tr>

    <tr>
        <th rowspan="2">Duration</th>
        <td>4 Months</td>
        <td>5 Months</td>
    </tr>

    <tr>
        <td>Full Time</td>
        <td>Full Time</td>
    </tr>

    </table>
</body>
</html>
