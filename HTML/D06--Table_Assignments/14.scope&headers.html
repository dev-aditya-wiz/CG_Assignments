<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scope + headers</title>
</head>
<body>
    <table border="1">

    <tr>
        <th id="student" scope="col">Student</th>
        <th id="marks" scope="col">Marks</th>
        <th id="result" scope="col">Result</th>
    </tr>

    <tr>
        <th id="aditya" scope="row">Aditya</th>
        <td headers="aditya marks">85</td>
        <td headers="aditya result">Pass</td>
    </tr>

    <tr>
        <th id="rahul" scope="row">Rahul</th>
        <td headers="rahul marks">78</td>
        <td headers="rahul result">Pass</td>
    </tr>

    </table>
</body>
</html>
