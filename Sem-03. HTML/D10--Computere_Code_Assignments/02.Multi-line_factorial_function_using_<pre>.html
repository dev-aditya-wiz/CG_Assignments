<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-line factorial function using <pre></title>
</head>
<body>
    <pre>
    def factorial(n):
    if n == 0:
        return 1
    else:
        return n * factorial(n - 1)
</pre>
</body>
</html>
