<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable with rowspan</title>
</head>
<body>
    <table border="1">

    <caption>Weekly Class Schedule</caption>

    <thead>
        <tr>
            <th scope="col">Day</th>
            <th scope="col">Subject</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <th rowspan="3" scope="row">Monday</th>
            <td>HTML</td>
        </tr>

        <tr>
            <td>CSS</td>
        </tr>

        <tr>
            <td>JavaScript</td>
        </tr>
    </tbody>

    </table>
</body>
</html>
