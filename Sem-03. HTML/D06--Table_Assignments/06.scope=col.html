<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scope="col"</title>
</head>
<body>
    <table border="1">

    <tr>
        <th scope="col">Name</th>
        <th scope="col">Age</th>
        <th scope="col">City</th>
    </tr>

    <tr>
        <td>Aditya</td>
        <td>20</td>
        <td>Patna</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>21</td>
        <td>Delhi</td>
    </tr>

    </table>
</body>
</html>
