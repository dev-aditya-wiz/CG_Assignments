<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Unordered List</title>
</head>
<body>
    <ul type="disc">

    <li>
        Frontend

        <ul type="circle">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

    </li>

    <li>
        Backend

        <ul type="square">
            <li>Python</li>
            <li>Java</li>
            <li>Node.js</li>
        </ul>

    </li>

</ul>
</body>
</html>
