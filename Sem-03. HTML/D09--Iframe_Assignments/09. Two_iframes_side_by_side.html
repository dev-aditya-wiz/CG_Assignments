<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two iframes side by side</title>
</head>
<body>
    <iframe
    src="https://example.com"
    width="48%"
    height="350"
    allow="fullscreen"
    title="Fullscreen Content"
    style="border: none;">
    </iframe>

    <iframe
    src="https://example.com"
    width="48%"
    height="350"
    allow="gyroscope"
    title="Gyroscope Content"
    style="border: none;">
    </iframe>
</body>
</html>
