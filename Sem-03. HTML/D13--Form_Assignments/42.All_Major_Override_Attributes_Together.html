<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form
    action="/default.php"
    method="post"
    target="_self"
    >

    <h2>Form Override Demonstration</h2>

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        required
    >

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <button type="submit">
        Default Submit
    </button>

    <button
        type="submit"
        formaction="/different-action.php"
    >
        Override Action
    </button>

    <button
        type="submit"
        formmethod="get"
    >
        Override Method
    </button>

    <button
        type="submit"
        formnovalidate
    >
        Skip Validation
    </button>

    <button
        type="submit"
        formtarget="_blank"
    >
        Open in New Tab
    </button>

</form>
</body>
</html>
