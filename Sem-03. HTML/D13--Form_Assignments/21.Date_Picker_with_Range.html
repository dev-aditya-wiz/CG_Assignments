<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="date">Select a date in 2023:</label>

        <input
        type="date"
        id="date"
        name="date"
        min="2023-01-01"
        max="2023-12-31"
        >

        <button type="submit">Submit</button>
    </form>
</body>
</html>
