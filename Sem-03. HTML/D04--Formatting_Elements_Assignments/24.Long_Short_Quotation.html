<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long + Short Quotation</title>
</head>
<body>
    <blockquote>
    Daily coding practice helps developers improve their problem-solving
    skills and become more confident programmers.
    </blockquote>
    <p>Our mentor always says <q>Practice makes progress.</q></p>
</body>
</html>
